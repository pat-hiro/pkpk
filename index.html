<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重記録アプリ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>体重記録アプリ</h1>

        <section class="input-section">
            <h2>体重を記録</h2>
            <form id="weight-form">
                <div class="form-group">
                    <label for="datetime-input">日時</label>
                    <input type="datetime-local" id="datetime-input" required>
                    <button type="button" id="now-btn" class="link-btn">今の時刻にする</button>
                </div>
                <div class="form-group">
                    <label for="weight-input">体重 (kg)</label>
                    <input type="number" id="weight-input" step="0.1" min="0" max="500" placeholder="例: 65.5" required>
                </div>
                <button type="submit">記録する</button>
            </form>
            <p id="message" class="message"></p>
        </section>

        <section class="backup-section">
            <h2>バックアップ</h2>
            <p class="hint">ブラウザのデータが消えると記録も消えます。定期的にエクスポートして保存してください。</p>
            <div class="backup-buttons">
                <button type="button" id="export-btn">エクスポート (JSON)</button>
                <button type="button" id="import-btn" class="secondary">インポート</button>
                <input type="file" id="import-file" accept="application/json,.json" hidden>
            </div>
        </section>

        <section class="chart-section">
            <h2>体重の推移</h2>
            <div class="chart-wrapper">
                <canvas id="weight-chart"></canvas>
            </div>
            <p id="no-data" class="no-data">まだ記録がありません。上のフォームから記録を追加してください。</p>
        </section>

        <section class="history-section">
            <h2>記録一覧</h2>
            <div class="stats" id="stats"></div>
            <ul id="history-list"></ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
